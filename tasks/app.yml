---
- name: Cartelle dell'applicazione
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(eduwisp_user) }}"
    group: "{{ eduwisp_user }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - { path: "{{ eduwisp_home }}" }
    - { path: "{{ eduwisp_home }}/project" , owner: root }
    - { path: "{{ eduwisp_home }}/project/eduwisp_server", owner: root }
    - { path: "{{ eduwisp_home }}/static", owner: root, mode: "0755" }
    - { path: /etc/eduwisp, owner: root }
    - { path: /var/lib/eduwisp, mode: "0750" }
    # Loghi delle app, letti da nginx (gruppo eduwisp); APK non pubblici (ADR-0020).
    - { path: "{{ eduwisp_home }}/media" }
    - { path: /var/lib/eduwisp/privato, mode: "0700" }
    # APK del DPC per la registrazione con il QR code, servito da nginx.
    - { path: "{{ eduwisp_home }}/dpc", owner: root }

- name: Chiave segreta di Django (generata una sola volta sul server)
  ansible.builtin.shell: |
    umask 027
    python3 -c 'import secrets; print(secrets.token_urlsafe(64))' > /etc/eduwisp/secret_key
  args:
    creates: /etc/eduwisp/secret_key

- name: Permessi della chiave segreta
  ansible.builtin.file:
    path: /etc/eduwisp/secret_key
    owner: root
    group: "{{ eduwisp_user }}"
    mode: "0640"

- name: Password di Valkey (generata una sola volta sul server)
  ansible.builtin.shell: |
    umask 027
    python3 -c 'import secrets; print(secrets.token_urlsafe(48))' > /etc/eduwisp/valkey_password
  args:
    creates: /etc/eduwisp/valkey_password

- name: Permessi della password di Valkey
  ansible.builtin.file:
    path: /etc/eduwisp/valkey_password
    owner: root
    group: "{{ eduwisp_user }}"
    mode: "0640"

- name: Versioni dei moduli
  ansible.builtin.include_tasks: release.yml

- name: Le versioni installate coincidono con il rilascio
  ansible.builtin.assert:
    that: eduwisp_prima_installazione or eduwisp_moduli_diversi | length == 0
    fail_msg: >-
      I moduli {{ eduwisp_moduli_diversi | join(', ') }} sono a una versione diversa da quella
      richiesta (rilascio {{ eduwisp_platform_release }}). Per non cambiare il database senza backup,
      il ruolo non li aggiorna: usa la procedura di aggiornamento (aggiorna.yml, vedi il README).
    quiet: true

- name: Prima installazione dei moduli
  ansible.builtin.include_tasks: moduli.yml
  when: eduwisp_prima_installazione

- name: Pagina di manutenzione
  ansible.builtin.include_tasks: manutenzione.yml

- name: Progetto, migrazioni e file statici
  ansible.builtin.include_tasks: progetto.yml

- name: Servizio systemd (con isolamento)
  ansible.builtin.template:
    src: eduwisp.service.j2
    dest: /etc/systemd/system/eduwisp.service
    mode: "0644"
  notify: [Ricarica systemd, Riavvia eduwisp]

- name: Servizio EduWISP attivo
  ansible.builtin.systemd_service:
    name: eduwisp
    enabled: true
    state: started
    daemon_reload: true

- name: Regole di audit per i file di EduWISP
  ansible.builtin.template:
    src: audit-eduwisp-app.rules.j2
    dest: /etc/audit/rules.d/60-eduwisp-app.rules
    mode: "0640"
  notify: Riavvia auditd

- name: Amministratore di EduWISP (dal vault)
  when: eduwisp_admin_user | length > 0 and eduwisp_admin_password | length > 0
  block:
    - name: Script di gestione dell'amministratore
      ansible.builtin.template:
        src: admin_account.py.j2
        dest: "{{ eduwisp_home }}/project/admin_account.py"
        owner: root
        group: "{{ eduwisp_user }}"
        mode: "0640"

    - name: Crea o aggiorna l'amministratore
      become: true
      become_user: "{{ eduwisp_user }}"
      ansible.builtin.shell: "{{ eduwisp_home }}/venv/bin/python manage.py shell < admin_account.py"
      args:
        chdir: "{{ eduwisp_home }}/project"
      environment:
        EDUWISP_ADMIN_USER: "{{ eduwisp_admin_user }}"
        EDUWISP_ADMIN_EMAIL: "{{ eduwisp_admin_email }}"
        EDUWISP_ADMIN_PASSWORD: "{{ eduwisp_admin_password }}"
      register: eduwisp_admin_result
      changed_when: "'invariato' not in eduwisp_admin_result.stdout"
      no_log: true

# Solo per l'ambiente demo (ADR-0015): dati inventati, mai in produzione.
- name: Dati di esempio della demo
  when: eduwisp_demo_data | bool
  block:
    - name: I dati di esempio sono ammessi solo in un ambiente di prova
      ansible.builtin.assert:
        that: eduwisp_environment_notice | length > 0
        fail_msg: >-
          eduwisp_demo_data richiede un ambiente di prova con eduwisp_environment_notice
          impostato (ADR-0015): i dati di esempio non vanno mai in produzione.
        quiet: true

    - name: Script dei dati di esempio
      ansible.builtin.copy:
        src: demo_data.py
        dest: "{{ eduwisp_home }}/project/demo_data.py"
        owner: root
        group: "{{ eduwisp_user }}"
        mode: "0640"

    - name: Carica i dati di esempio (solo se mancano)
      become: true
      become_user: "{{ eduwisp_user }}"
      ansible.builtin.shell: "{{ eduwisp_home }}/venv/bin/python manage.py shell < demo_data.py"
      args:
        chdir: "{{ eduwisp_home }}/project"
      environment:
        EDUWISP_DEMO_RESET: "{{ '1' if eduwisp_demo_data_reset | bool else '0' }}"
      register: eduwisp_demo_result
      changed_when: "'invariati' not in eduwisp_demo_result.stdout"

    - name: Esito dei dati di esempio
      ansible.builtin.debug:
        msg: "{{ eduwisp_demo_result.stdout_lines | last }}"

- name: APK del DPC per la registrazione con il QR code
  when: eduwisp_android_dpc_apk | length > 0
  block:
    - name: Pubblica l'APK firmato
      ansible.builtin.copy:
        src: "{{ eduwisp_android_dpc_apk }}"
        dest: "{{ eduwisp_home }}/dpc/eduwisp-dpc.apk"
        owner: root
        group: "{{ eduwisp_user }}"
        mode: "0640"

    - name: L'impronta della firma deve essere indicata
      ansible.builtin.assert:
        that: eduwisp_android_dpc.signature_checksum | length > 0
        fail_msg: >-
          Manca eduwisp_android_dpc.signature_checksum: senza impronta Android non accetta
          il DPC durante la registrazione con il QR code.
